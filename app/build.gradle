plugins { id 'com.android.application' }

// version.json é a mesma fonte que o app consulta para saber se há atualização.
def ver = new groovy.json.JsonSlurper().parse(rootProject.file('version.json'))

android {
    namespace 'com.foco.tdah'
    compileSdk 34

    defaultConfig {
        applicationId 'com.foco.tdah'
        minSdk 26
        targetSdk 34
        versionCode ver.apk as int
        versionName "1.${ver.apk}"
        buildConfigField 'int', 'WEB_VERSION', "${ver.web}"
    }
    // Chave fixa para que as atualizações instalem por cima da versão anterior.
    signingConfigs {
        foco {
            storeFile file('foco.keystore')
            storePassword 'focotdah'
            keyAlias 'foco'
            keyPassword 'focotdah'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.foco }
        debug { signingConfig signingConfigs.foco }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
