plugins { id 'com.android.application' }

android {
    namespace 'com.foco.tdah'
    compileSdk 34

    defaultConfig {
        applicationId 'com.foco.tdah'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    // Chave fixa para que as atualizações instalem por cima da versão anterior.
    signingConfigs {
        foco {
            storeFile file('foco.keystore')
            storePassword 'focotdah'
            keyAlias 'foco'
            keyPassword 'focotdah'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.foco }
        debug { signingConfig signingConfigs.foco }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
